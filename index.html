<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-family: Arial, sans-serif;
      background: #fdf6e3;
    }
    img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
    }
    form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      background: transparent;
      border-radius: 8px;
    }
    form h2 {
      text-align: right;
      font-size: 22px;
      color: #00008b;
    }
    label {
      font-weight: bold;
      color: #00008b;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fdf6e3;
    }
    button {
      padding: 12px;
      font-size: 16px;
      background: #fdf6e3;
      color: #000;
      border: 1px solid #00008b;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <img src="img.jpeg" alt="img">
  <img src="img2.jpeg" alt="img2">
  <a href="https://daralhadarah.net/"><img src="img5.jpeg" alt="img5"></a>

  <form>
    <h2>تواصل معنا</h2>
    <div>
      <label for="name">الإسم</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">الإيميل</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="phone">رقم الجوال</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <button type="submit">إرسال</button>
  </form>

  <img src="img4.jpeg" alt="img4">

  <footer>
  </footer>
</html>
